name: Build CueBox Multi-Platform

on:
  push:
    tags: ['v*']        # 推送 v1.0.0 等版本标签时触发
    branches: [main]    # push 到 main 也触发
  workflow_dispatch:    # 支持手动触发

jobs:
  # ---------- Android ----------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cuebox-android-apk
          path: build/app/outputs/flutter-apk/*.apk

  # ---------- iOS ----------
  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: cuebox-ios-unsigned
          path: build/ios/iphoneos/*.app

  # ---------- macOS ----------
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: cuebox-macos
          path: build/macos/Build/Products/Release/*.app

  # ---------- Windows ----------
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: cuebox-windows
          path: build/windows/x64/runner/Release

  # ---------- 打包发布 Release（只在打 tag 时执行）----------
  release:
    name: Publish GitHub Release
    needs: [android, ios, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 打包各平台产物
        shell: bash
        run: |
          set -e
          mkdir -p dist
          # Android
          cp artifacts/cuebox-android-apk/*.apk dist/CueBox-android.apk
          # Windows：压缩成 zip
          (cd artifacts/cuebox-windows && zip -r ../../dist/CueBox-windows.zip .)
          # macOS：压缩成 zip
          (cd artifacts/cuebox-macos && zip -r ../../dist/CueBox-macos.zip .)
          # iOS：未签名 .app 压缩
          (cd artifacts/cuebox-ios-unsigned && zip -r ../../dist/CueBox-ios-unsigned.zip .)
          ls -lh dist/
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
